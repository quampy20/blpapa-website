<!-- Decap CMS. This is the one place the site loads a third-party script, and
     it is deliberate: it is the entire reason a non-technical owner can edit
     this site at all (CLAUDE.md §2). It loads only here, behind a login, and
     never on a public page.

     Netlify Identity provides the login; Git Gateway commits the owner's edits
     to the repository on her behalf, so she never sees git. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
</body>
